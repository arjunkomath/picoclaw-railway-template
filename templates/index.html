<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PicoClaw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
            body: ['"DM Sans"', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
    if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
      document.documentElement.classList.toggle('dark', e.matches);
    });
  </script>
  <script>window.__PROVIDER_CATALOG__ = {{ provider_catalog | tojson }};</script>
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { font-family: 'DM Sans', system-ui, sans-serif; }
    h1, h2, h3, .font-display { font-family: 'Space Grotesk', system-ui, sans-serif; }
    .log-viewer { font-family: 'Menlo', 'Monaco', 'Courier New', monospace; font-size: 13px; line-height: 1.6; }
    .log-viewer::-webkit-scrollbar { width: 5px; }
    .log-viewer::-webkit-scrollbar-thumb { border-radius: 3px; }
    .dark .log-viewer::-webkit-scrollbar-thumb { background: #44403c; }
    .log-viewer::-webkit-scrollbar-thumb { background: #d6d3d1; }
    input[type="password"], input[type="text"], input[type="number"], select {
      transition: border-color 0.15s ease;
    }
    input:focus, select:focus {
      border-color: #d97706 !important;
      box-shadow: 0 0 0 1px #d97706;
    }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100 min-h-screen" x-data="app()" x-init="init()" x-cloak>

  <div class="max-w-3xl mx-auto px-5 py-8">

    <header class="flex items-center justify-between mb-10">
      <div class="flex items-center gap-3">
        <h1 class="text-xl font-display font-bold tracking-tight">PicoClaw</h1>
        <span class="text-[11px] px-2 py-0.5 rounded font-medium font-display tracking-wide uppercase"
              :class="status.gateway?.state === 'running' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-400' : status.gateway?.state === 'error' ? 'bg-red-100 text-red-700 dark:bg-red-500/15 dark:text-red-400' : 'bg-stone-200 text-stone-500 dark:bg-stone-800 dark:text-stone-500'"
              x-text="status.gateway?.state || 'unknown'"></span>
      </div>
      <button @click="restartGateway()" class="text-xs font-medium px-3 py-1.5 border border-stone-300 dark:border-stone-700 rounded hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors">
        Restart Gateway
      </button>
    </header>

    <nav class="flex gap-6 mb-8 border-b border-stone-200 dark:border-stone-800">
      <button @click="tab = 'config'" class="pb-2.5 text-sm font-medium transition-colors border-b-2 -mb-px"
              :class="tab === 'config' ? 'border-stone-900 text-stone-900 dark:border-stone-100 dark:text-stone-100' : 'border-transparent text-stone-400 hover:text-stone-600 dark:hover:text-stone-300'">Configuration</button>
      <button @click="tab = 'status'" class="pb-2.5 text-sm font-medium transition-colors border-b-2 -mb-px"
              :class="tab === 'status' ? 'border-stone-900 text-stone-900 dark:border-stone-100 dark:text-stone-100' : 'border-transparent text-stone-400 hover:text-stone-600 dark:hover:text-stone-300'">Status</button>
    </nav>

    <!-- ═══ CONFIG TAB ═══ -->
    <div x-show="tab === 'config'" class="space-y-10">

      <!-- ── Providers ── -->
      <section>
        <div class="flex items-baseline justify-between mb-3">
          <h2 class="font-display font-semibold">Providers</h2>
          <div class="flex items-center gap-3">
            <span class="text-xs text-stone-400" x-text="providerGroups.filter(g => g.api_key).length + ' of ' + providerGroups.length + ' configured'"></span>
            <button @click="showAddProvider = !showAddProvider"
                    x-show="availableProviders.length > 0"
                    class="text-xs font-medium px-2.5 py-1 rounded border border-stone-300 dark:border-stone-700 hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors">
              + Add provider
            </button>
          </div>
        </div>

        <div x-show="showAddProvider" x-collapse class="mb-3 rounded-lg border border-amber-200 dark:border-amber-800/50 bg-amber-50/60 dark:bg-amber-900/10 p-3">
          <div class="text-xs text-stone-500 dark:text-stone-400 mb-2">Choose a provider to add:</div>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
            <template x-for="p in availableProviders" :key="p.provider">
              <button @click="addProvider(p.provider)"
                      class="text-left text-sm px-3 py-2 rounded border border-stone-200 dark:border-stone-700 bg-white dark:bg-stone-800 hover:border-amber-400 dark:hover:border-amber-600 transition-colors">
                <span class="font-medium font-display" x-text="p.display"></span>
              </button>
            </template>
          </div>
          <button @click="showAddProvider = false" class="mt-3 text-xs text-stone-500 hover:text-stone-700 dark:hover:text-stone-300">Cancel</button>
        </div>

        <div class="border border-stone-200 dark:border-stone-800 rounded-lg overflow-hidden divide-y divide-stone-200 dark:divide-stone-800">
          <template x-for="group in providerGroups" :key="group.provider">
            <div>
              <button @click="openProvider = openProvider === group.provider ? null : group.provider"
                      class="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-stone-100/60 dark:hover:bg-stone-800/40 transition-colors">
                <span class="w-1.5 h-1.5 rounded-full shrink-0"
                      :class="group.api_key ? 'bg-emerald-500' : 'bg-stone-300 dark:bg-stone-600'"></span>
                <span class="text-sm font-medium font-display" x-text="providerDisplayName(group.provider)"></span>
                <span class="text-xs text-stone-400" x-text="group.models.length + (group.models.length === 1 ? ' model' : ' models')"></span>
                <span class="flex-1"></span>
                <svg class="w-4 h-4 text-stone-400 transition-transform duration-200" :class="openProvider === group.provider && 'rotate-180'"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </button>

              <div x-show="openProvider === group.provider" x-collapse>
                <div class="px-4 pb-4 pt-1 space-y-3 border-t border-stone-100 dark:border-stone-800/60 bg-stone-50 dark:bg-stone-900/40">
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">API Key</label>
                      <input type="password"
                             class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-2 text-sm outline-none"
                             :value="group.api_key"
                             @input="setProviderKey(group, $event.target.value)"
                             placeholder="Enter API key">
                    </div>
                    <div>
                      <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">Base URL</label>
                      <input type="text"
                             class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-2 text-sm outline-none"
                             :value="group.api_base"
                             @input="setProviderBase(group, $event.target.value)"
                             :placeholder="group.api_base || 'Default'">
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1.5">Models</label>
                    <div class="space-y-1">
                      <template x-for="(modelName, mi) in group.models" :key="mi">
                        <div class="flex items-center justify-between py-1.5 px-2.5 rounded text-sm bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700">
                          <div>
                            <span x-text="modelName"></span>
                            <span class="text-xs text-stone-400 ml-1.5" x-text="config.model_list[group.indices[mi]]?.model"></span>
                          </div>
                          <button @click="removeModel(group.indices[mi])"
                                  class="text-stone-400 hover:text-red-500 dark:hover:text-red-400 transition-colors text-xs ml-2 shrink-0">Remove</button>
                        </div>
                      </template>
                    </div>

                    <template x-if="addingModelTo === group.provider">
                      <div class="mt-2 space-y-2 p-3 rounded border border-amber-200 dark:border-amber-800/50 bg-amber-50/60 dark:bg-amber-900/10">
                        <div>
                          <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">Display Name</label>
                          <input type="text" x-model="newModelName" placeholder="e.g. gpt-4o-mini"
                                 class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-1.5 text-sm outline-none">
                        </div>
                        <div>
                          <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">Model ID</label>
                          <input type="text" x-model="newModelId" placeholder="e.g. gpt-4o-mini"
                                 class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-1.5 text-sm outline-none">
                        </div>
                        <div class="flex gap-2 pt-1">
                          <button @click="addModelToProvider(group)"
                                  class="text-xs font-medium px-3 py-1.5 bg-stone-900 dark:bg-stone-100 text-white dark:text-stone-900 rounded hover:bg-stone-800 dark:hover:bg-stone-200 transition-colors">Add Model</button>
                          <button @click="addingModelTo = null"
                                  class="text-xs px-3 py-1.5 text-stone-500 hover:text-stone-700 dark:hover:text-stone-300">Cancel</button>
                        </div>
                      </div>
                    </template>
                    <button x-show="addingModelTo !== group.provider"
                            @click="addingModelTo = group.provider; newModelName = ''; newModelId = ''"
                            class="mt-2 text-xs text-stone-400 hover:text-stone-600 dark:hover:text-stone-300 transition-colors">
                      + Add model
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>
      </section>

      <!-- ── Agent Defaults ── -->
      <section>
        <h2 class="font-display font-semibold mb-3">Agent Defaults</h2>
        <div class="border border-stone-200 dark:border-stone-800 rounded-lg p-4">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">Default Model</label>
              <select class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-2 text-sm outline-none"
                      x-model="config.agents.defaults.model_name">
                <option value="">Select a model</option>
                <template x-for="m in config.model_list" :key="m.model_name">
                  <option :value="m.model_name" x-text="m.model_name"></option>
                </template>
              </select>
            </div>
            <div>
              <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">Max Tokens</label>
              <input type="number" class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-2 text-sm outline-none"
                     x-model.number="config.agents.defaults.max_tokens">
            </div>
            <div>
              <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">Max Tool Iterations</label>
              <input type="number" class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-2 text-sm outline-none"
                     x-model.number="config.agents.defaults.max_tool_iterations">
            </div>
          </div>
        </div>
      </section>

      <!-- ── Channels ── -->
      <section>
        <h2 class="font-display font-semibold mb-3">Channels</h2>
        <div class="border border-stone-200 dark:border-stone-800 rounded-lg overflow-hidden divide-y divide-stone-200 dark:divide-stone-800">

          <!-- Telegram -->
          <div>
            <button @click="openChannel = openChannel === 'telegram' ? null : 'telegram'"
                    class="w-full flex items-center justify-between px-4 py-3 text-left hover:bg-stone-100/60 dark:hover:bg-stone-800/40 transition-colors">
              <span class="text-sm font-medium font-display">Telegram</span>
              <div class="flex items-center gap-3">
                <span class="text-[11px] px-1.5 py-0.5 rounded font-medium"
                      :class="config.channel_list.telegram.enabled ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-400' : 'bg-stone-100 text-stone-400 dark:bg-stone-800 dark:text-stone-500'"
                      x-text="config.channel_list.telegram.enabled ? 'On' : 'Off'"></span>
                <svg class="w-4 h-4 text-stone-400 transition-transform duration-200" :class="openChannel === 'telegram' && 'rotate-180'"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </div>
            </button>
            <div x-show="openChannel === 'telegram'" x-collapse>
              <div class="px-4 pb-4 pt-2 space-y-3 border-t border-stone-100 dark:border-stone-800/60 bg-stone-50 dark:bg-stone-900/40">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" class="rounded bg-stone-100 border-stone-300 dark:bg-stone-800 dark:border-stone-600 accent-amber-600" x-model="config.channel_list.telegram.enabled">
                  <span class="text-sm text-stone-600 dark:text-stone-400">Enable Telegram</span>
                </label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">Bot Token</label>
                    <input type="password" class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-2 text-sm outline-none"
                           x-model="config.channel_list.telegram.settings.token" placeholder="Token from @BotFather">
                  </div>
                  <div>
                    <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">Allowed Users</label>
                    <input type="text" class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-2 text-sm outline-none"
                           :value="(config.channel_list.telegram.allow_from || []).join(', ')"
                           @input="config.channel_list.telegram.allow_from = $event.target.value.split(',').map(s => s.trim()).filter(Boolean)"
                           placeholder="Comma-separated user IDs">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Discord -->
          <div>
            <button @click="openChannel = openChannel === 'discord' ? null : 'discord'"
                    class="w-full flex items-center justify-between px-4 py-3 text-left hover:bg-stone-100/60 dark:hover:bg-stone-800/40 transition-colors">
              <span class="text-sm font-medium font-display">Discord</span>
              <div class="flex items-center gap-3">
                <span class="text-[11px] px-1.5 py-0.5 rounded font-medium"
                      :class="config.channel_list.discord.enabled ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-400' : 'bg-stone-100 text-stone-400 dark:bg-stone-800 dark:text-stone-500'"
                      x-text="config.channel_list.discord.enabled ? 'On' : 'Off'"></span>
                <svg class="w-4 h-4 text-stone-400 transition-transform duration-200" :class="openChannel === 'discord' && 'rotate-180'"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </div>
            </button>
            <div x-show="openChannel === 'discord'" x-collapse>
              <div class="px-4 pb-4 pt-2 space-y-3 border-t border-stone-100 dark:border-stone-800/60 bg-stone-50 dark:bg-stone-900/40">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" class="rounded bg-stone-100 border-stone-300 dark:bg-stone-800 dark:border-stone-600 accent-amber-600" x-model="config.channel_list.discord.enabled">
                  <span class="text-sm text-stone-600 dark:text-stone-400">Enable Discord</span>
                </label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">Bot Token</label>
                    <input type="password" class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-2 text-sm outline-none"
                           x-model="config.channel_list.discord.settings.token" placeholder="Token from Developer Portal">
                  </div>
                  <div>
                    <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">Allowed Users</label>
                    <input type="text" class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-2 text-sm outline-none"
                           :value="(config.channel_list.discord.allow_from || []).join(', ')"
                           @input="config.channel_list.discord.allow_from = $event.target.value.split(',').map(s => s.trim()).filter(Boolean)"
                           placeholder="Comma-separated user IDs">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Slack -->
          <div>
            <button @click="openChannel = openChannel === 'slack' ? null : 'slack'"
                    class="w-full flex items-center justify-between px-4 py-3 text-left hover:bg-stone-100/60 dark:hover:bg-stone-800/40 transition-colors">
              <span class="text-sm font-medium font-display">Slack</span>
              <div class="flex items-center gap-3">
                <span class="text-[11px] px-1.5 py-0.5 rounded font-medium"
                      :class="config.channel_list.slack.enabled ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-400' : 'bg-stone-100 text-stone-400 dark:bg-stone-800 dark:text-stone-500'"
                      x-text="config.channel_list.slack.enabled ? 'On' : 'Off'"></span>
                <svg class="w-4 h-4 text-stone-400 transition-transform duration-200" :class="openChannel === 'slack' && 'rotate-180'"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </div>
            </button>
            <div x-show="openChannel === 'slack'" x-collapse>
              <div class="px-4 pb-4 pt-2 space-y-3 border-t border-stone-100 dark:border-stone-800/60 bg-stone-50 dark:bg-stone-900/40">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" class="rounded bg-stone-100 border-stone-300 dark:bg-stone-800 dark:border-stone-600 accent-amber-600" x-model="config.channel_list.slack.enabled">
                  <span class="text-sm text-stone-600 dark:text-stone-400">Enable Slack</span>
                </label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">Bot Token</label>
                    <input type="password" class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-2 text-sm outline-none"
                           x-model="config.channel_list.slack.settings.bot_token" placeholder="xoxb-...">
                  </div>
                  <div>
                    <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">App Token</label>
                    <input type="password" class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-2 text-sm outline-none"
                           x-model="config.channel_list.slack.settings.app_token" placeholder="xapp-...">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- WhatsApp -->
          <div>
            <button @click="openChannel = openChannel === 'whatsapp' ? null : 'whatsapp'"
                    class="w-full flex items-center justify-between px-4 py-3 text-left hover:bg-stone-100/60 dark:hover:bg-stone-800/40 transition-colors">
              <span class="text-sm font-medium font-display">WhatsApp</span>
              <div class="flex items-center gap-3">
                <span class="text-[11px] px-1.5 py-0.5 rounded font-medium"
                      :class="config.channel_list.whatsapp.enabled ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-400' : 'bg-stone-100 text-stone-400 dark:bg-stone-800 dark:text-stone-500'"
                      x-text="config.channel_list.whatsapp.enabled ? 'On' : 'Off'"></span>
                <svg class="w-4 h-4 text-stone-400 transition-transform duration-200" :class="openChannel === 'whatsapp' && 'rotate-180'"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </div>
            </button>
            <div x-show="openChannel === 'whatsapp'" x-collapse>
              <div class="px-4 pb-4 pt-2 space-y-3 border-t border-stone-100 dark:border-stone-800/60 bg-stone-50 dark:bg-stone-900/40">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input type="checkbox" class="rounded bg-stone-100 border-stone-300 dark:bg-stone-800 dark:border-stone-600 accent-amber-600" x-model="config.channel_list.whatsapp.enabled">
                  <span class="text-sm text-stone-600 dark:text-stone-400">Enable WhatsApp</span>
                </label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">Bridge URL</label>
                    <input type="text" class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-2 text-sm outline-none"
                           x-model="config.channel_list.whatsapp.settings.bridge_url" placeholder="ws://localhost:3001">
                  </div>
                  <div>
                    <label class="block text-xs text-stone-500 dark:text-stone-400 mb-1">Allowed Numbers</label>
                    <input type="text" class="w-full bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded px-3 py-2 text-sm outline-none"
                           :value="(config.channel_list.whatsapp.allow_from || []).join(', ')"
                           @input="config.channel_list.whatsapp.allow_from = $event.target.value.split(',').map(s => s.trim()).filter(Boolean)"
                           placeholder="Comma-separated numbers">
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Feishu -->
          <div>
            <button @click="openChannel = openChannel === 'feishu' ? null : 'feishu'"
                    class="w-full flex items-center justify-between px-4 py-3 text-left hover:bg-stone-100/60 dark:hover:bg-stone-800/40 transition-colors">
              <span class="text-sm font-medium font-display">Feishu</span>
              <div class="flex items-center gap-3">
                <span class="text-[11px] px-1.5 py-0.5 rounded font-medium"

    <!-- ═══ STATUS TAB ═══ -->

      <!-- Gateway -->
      <section>

                <span class="text-xs text-stone-400">State</span>

                  'text-emerald-600 dark:text-emerald-400': status.gateway?.state === 'running',
                  'text-red-600 dark:text-red-400': status.gateway?.state === 'error',

              <div x-show="status.gateway?.pid">

              <div x-show="status.gateway?.uptime != null">

              <div>

              <button @click="stopGateway()" class="text-xs font-medium px-3 py-1.5 border border-stone-300 dark:border-stone-700 rounded hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors"

              <button @click="restartGateway()" class="text-xs font-medium px-3 py-1.5 border border-stone-300 dark:border-stone-700 rounded hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors">Restart</button>

        <div class="border border-stone-200 dark:border-stone-800 rounded-lg p-4">

    <!-- Toast -->
    <div x-show="toast.show" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         class="fixed bottom-6 right-6 px-4 py-3 rounded-lg text-sm font-medium text-white shadow-lg"
         :class="toast.type === 'error' ? 'bg-red-600' : 'bg-stone-900 dark:bg-stone-100 dark:text-stone-900'">
      <span x-text="toast.message"></span>
    </div>

  <script>
    function app() {
      return {
        tab: 'config',
        config: defaultConfig(),
        status: {},
        logs: [],
        saving: false,
        restartAfterSave: true,
        toast: { show: false, message: '', type: 'success' },
        openProvider: null,
        openChannel: null,
        addingModelTo: null,
        newModelName: '',
        newModelId: '',
        showAddProvider: false,
        providerCatalog: window.__PROVIDER_CATALOG__ || [],

        get providerGroups() {
          const groups = {};
          (this.config.model_list || []).forEach((m, idx) => {
            const provider = modelProvider(m);
            if (!provider) return;
            const key = (m.api_keys && m.api_keys[0]) || '';
            if (!groups[provider]) {
              groups[provider] = { provider, models: [], indices: [], api_key: key, api_base: m.api_base || '' };
            }
            groups[provider].models.push(m.model_name);
            groups[provider].indices.push(idx);
          });
          const values = Object.values(groups);
          values.sort((a, b) => {
            const ac = a.api_key ? 1 : 0;
            const bc = b.api_key ? 1 : 0;
            if (ac !== bc) return bc - ac;
            return a.provider.localeCompare(b.provider);
          });
          return values;
        },

        providerDisplayName(name) {
          const entry = this.providerCatalog.find(p => p.provider === name);
          if (entry) return entry.display;
          return name.charAt(0).toUpperCase() + name.slice(1);
        },

        get availableProviders() {
          const existing = new Set(this.providerGroups.map(g => g.provider));
          return this.providerCatalog.filter(p => !existing.has(p.provider));
        },

        addProvider(name) {
          const p = this.providerCatalog.find(k => k.provider === name);
          if (!p) return;
          const slug = p.seed_model.replace(/[\/:]/g, '-');
          this.config.model_list.push({
            model_name: `${p.provider}-${slug}`,
            provider: p.provider,
            model: p.seed_model,
            api_base: p.api_base,
            api_keys: [],
          });
          this.showAddProvider = false;
          this.openProvider = name;
        },

        setProviderKey(group, value) {
          group.indices.forEach(i => {
            const m = this.config.model_list[i];
            if (value) {
              m.api_keys = [value];
            } else {
              m.api_keys = [];
            }
            delete m.api_key;
          });
        },

        setProviderBase(group, value) {
          group.indices.forEach(i => { this.config.model_list[i].api_base = value; });
        },

        addModelToProvider(group) {
          if (!this.newModelName.trim() || !this.newModelId.trim()) return;
          const existing = this.config.model_list[group.indices[0]];
          let modelId = this.newModelId.trim();
          if (modelId.startsWith(group.provider + '/')) modelId = modelId.slice(group.provider.length + 1);
          if (!modelId) return;
          this.config.model_list.push({
            model_name: this.newModelName.trim(),
            provider: group.provider,
            model: modelId,
            api_base: existing?.api_base || '',
            api_keys: (existing?.api_keys && existing.api_keys.length) ? [...existing.api_keys] : [],
          });
          this.newModelName = '';
          this.newModelId = '';
          this.addingModelTo = null;
        },

        setBraveKey(value) {
          const brave = this.config.tools.web.brave;
          brave.api_keys = value ? [value] : [];
          brave.enabled = !!value;
        },

        removeModel(idx) {
          if (this.config.model_list.length <= 1) return;
          this.config.model_list.splice(idx, 1);
        },

        async init() {
          await this.loadConfig();
          await this.loadStatus();
          await this.loadLogs();
          setInterval(() => this.loadStatus(), 5000);
          setInterval(() => this.loadLogs(), 3000);
        },

        async loadConfig() {
          try {
            const res = await fetch('/api/config');
            if (res.ok) {
              const data = await res.json();
              this.config = mergeDeep(defaultConfig(), data);
            }
          } catch (e) {}
        },

        async saveConfig() {
          this.saving = true;
          try {
            const payload = JSON.parse(JSON.stringify(this.config));
            payload._restartGateway = this.restartAfterSave;
            const res = await fetch('/api/config', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });
            if (res.ok) {
              this.showToast('Configuration saved', 'success');
              await this.loadConfig();
            } else {
              try {
                const err = await res.json();
                this.showToast(err.error || 'Save failed (' + res.status + ')', 'error');
              } catch {
                const text = await res.text();
                this.showToast(text || 'Save failed (' + res.status + ')', 'error');
              }
            }
          } catch (e) {
            this.showToast('Save failed: ' + e.message, 'error');
          }
          this.saving = false;
        },

        async loadStatus() {
          try {
            const res = await fetch('/api/status');
            if (res.ok) this.status = await res.json();
          } catch (e) {}
        },

        async loadLogs() {
          try {
            const res = await fetch('/api/logs');
            if (res.ok) {
              const data = await res.json();
              const wasAtBottom = this.$refs.logViewer &&
                (this.$refs.logViewer.scrollTop + this.$refs.logViewer.clientHeight >= this.$refs.logViewer.scrollHeight - 50);
              this.logs = data.lines;
              if (wasAtBottom && this.$refs.logViewer) {
                this.$nextTick(() => { this.$refs.logViewer.scrollTop = this.$refs.logViewer.scrollHeight; });
              }
            }
          } catch (e) {}
        },

        async startGateway() {
          await fetch('/api/gateway/start', { method: 'POST' });
          this.showToast('Gateway starting', 'success');
          setTimeout(() => this.loadStatus(), 1000);
        },

        async stopGateway() {
          await fetch('/api/gateway/stop', { method: 'POST' });
          this.showToast('Gateway stopping', 'success');
          setTimeout(() => this.loadStatus(), 1000);
        },

        async restartGateway() {
          await fetch('/api/gateway/restart', { method: 'POST' });
          this.showToast('Gateway restarting', 'success');
          setTimeout(() => this.loadStatus(), 2000);
        },

        formatUptime(seconds) {
          if (seconds == null) return '';
          const h = Math.floor(seconds / 3600);
          const m = Math.floor((seconds % 3600) / 60);
          const s = seconds % 60;
          if (h > 0) return h + 'h ' + m + 'm ' + s + 's';
          if (m > 0) return m + 'm ' + s + 's';
          return s + 's';
        },

        showToast(message, type) {
          type = type || 'success';
          this.toast = { show: true, message, type };
          setTimeout(() => { this.toast.show = false; }, 3000);
        }
      };
    }

    // Only the paths the UI binds to. Everything else comes from the server
    // as-is, so nothing unknown to PicoClaw's config schema (v3) is added.
    const UI_CHANNELS = ['telegram', 'discord', 'slack', 'whatsapp', 'feishu', 'dingtalk', 'line'];

    function defaultConfig() {
      const channel_list = {};
      UI_CHANNELS.forEach(name => {
        channel_list[name] = { type: name, enabled: false, allow_from: [], settings: {} };
      });
      return {
        version: 3,
        agents: { defaults: { model_name: '', max_tokens: 32768, max_tool_iterations: 50 } },
        channel_list,
        model_list: [],
        tools: { web: { brave: { enabled: false, api_keys: [] }, duckduckgo: { enabled: true } } },
      };
    }

    function modelProvider(m) {
      if (m.provider) return m.provider;
      const model = m.model || '';
      return model.includes('/') ? model.split('/')[0] : '';
    }

    function mergeDeep(target, source) {
      const output = Object.assign({}, target);
      for (const key of Object.keys(source)) {
        if (Array.isArray(source[key])) {
          output[key] = source[key];
        } else if (source[key] && typeof source[key] === 'object') {
          output[key] = mergeDeep(target[key] || {}, source[key]);
        } else {
          output[key] = source[key];
        }
      }
      return output;
    }
